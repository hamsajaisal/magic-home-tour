<!doctype html>
<html lang="ml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Magic Home Tour – USS Practice Game</title>
  <meta name="description" content="A free 3D practice game for the Kerala USS scholarship exam (Classes 5–7), in Malayalam and English medium.">
  <meta name="theme-color" content="#ff8a3d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">{ "imports": { "three": "./js/lib/three.module.min.js" } }</script>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="fx"></canvas>

  <!-- Loading screen -->
  <div id="loading" class="screen">
    <div class="loader-house">🏡</div>
    <p data-i18n="loading">Getting the house ready…</p>
  </div>

  <!-- Start screen -->
  <div id="start" class="screen hidden">
    <div class="start-card">
      <div class="start-emoji">🏡✨</div>
      <h1 data-i18n="title">Magic Home Tour</h1>
      <p class="subtitle" data-i18n="subtitle"></p>
      <p class="label" data-i18n="chooseMedium"></p>
      <div class="medium-row">
        <button class="medium-btn" data-lang="ml">മലയാളം</button>
        <button class="medium-btn" data-lang="en">English</button>
      </div>
      <div class="start-btns">
        <button id="play-btn" class="big-btn" data-i18n="play">Let's play!</button>
        <button id="practice-btn" class="soft-btn big-soft" data-i18n="practiceMode">Quiz only mode</button>
        <button id="about-btn" class="soft-btn small" data-i18n="about">About</button>
      </div>
      <p class="start-stats" id="start-stats"></p>
    </div>
  </div>

  <!-- Quiz mode: choose subject and chapter -->
  <div id="practice" class="screen hidden">
    <div class="start-card practice-card">
      <h1 data-i18n="practiceMode">Quiz only mode</h1>
      <p class="subtitle" data-i18n="practiceIntro"></p>
      <label class="pr-field"><span data-i18n="practiceSubject">Subject</span>
        <select id="pr-subject"></select></label>
      <label class="pr-field"><span data-i18n="practiceChapterPick">Chapter</span>
        <select id="pr-chapter"></select></label>
      <label class="pr-field"><span data-i18n="practiceHowMany">How many questions</span>
        <select id="pr-count"></select></label>
      <div class="btn-row">
        <button id="pr-start" class="big-btn" data-i18n="practiceStart">Start the quiz</button>
        <button id="pr-back" class="soft-btn" data-i18n="practiceBack">Back</button>
      </div>
    </div>
  </div>

  <!-- Top bar -->
  <div id="hud" class="hidden">
    <div class="hud-pill" id="pill-coins" role="img">🪙 <span id="hud-coins">0</span></div>
    <div class="hud-pill hud-level" id="pill-level" role="img">⭐ <span data-i18n="level">Level</span> <span id="hud-level">1</span>
      <div class="xp-bar"><div id="hud-xp"></div></div>
    </div>
    <div class="hud-pill" id="pill-rooms" role="img">🚪 <span id="hud-rooms">0/0</span></div>
    <div class="hud-pill" id="hud-streak">🔥 0</div>
    <div class="hud-spacer"></div>
    <button class="hud-btn icon" id="shop-btn" aria-label="shop" data-i18n-label="shop">🛍️</button>
    <button class="hud-btn icon" id="album-btn" aria-label="album" data-i18n-label="album">📒</button>
    <button class="hud-btn icon" id="progress-btn" aria-label="progress" data-i18n-label="progress">📊</button>
    <button class="hud-btn" id="lang-btn">English</button>
    <button class="hud-btn icon" id="sound-btn" aria-label="sound" data-i18n-label="sound">🔊</button>
    <button class="hud-btn icon" id="settings-btn" aria-label="settings" data-i18n-label="settings">⚙️</button>
  </div>

  <div id="tip" class="hidden"></div>
  <div id="banner" class="hidden" role="status" aria-live="polite"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <!-- Door prompt -->
  <div id="prompt" class="hidden">
    <div class="prompt-emoji" id="prompt-emoji">🔒</div>
    <p id="prompt-text"></p>
    <div class="btn-row">
      <button class="big-btn" id="prompt-go" data-i18n="startQuiz"></button>
      <button class="soft-btn" id="prompt-no" data-i18n="notNow"></button>
    </div>
  </div>

  <!-- Quiz panel -->
  <div id="quiz" class="overlay hidden">
    <div class="quiz-card">
      <div class="quiz-top">
        <span id="quiz-room"></span>
        <span id="quiz-count"></span>
        <button class="soft-btn small icon" id="quiz-read" aria-label="read aloud" data-i18n-label="readAloud">🔈</button>
        <button class="soft-btn small" id="quiz-lang">English</button>
        <button class="close-x" id="quiz-close" aria-label="close" data-i18n-label="close">✕</button>
      </div>
      <div class="dots" id="quiz-dots"></div>
      <div id="quiz-body">
        <p class="q-text" id="q-text"></p>
        <div class="options" id="q-options"></div>
        <p class="small-note hidden" id="q-voice-note" role="status"></p>
        <div class="feedback hidden" id="q-feedback"></div>
        <button class="big-btn hidden" id="q-next"></button>
        <button class="soft-btn hidden" id="quiz-end" data-i18n="practiceEnd">End the quiz</button>
      </div>
      <div id="quiz-result" class="hidden">
        <div class="result-emoji" id="r-emoji">🎉</div>
        <h2 id="r-title"></h2>
        <div class="stars" id="r-stars"></div>
        <p id="r-text"></p>
        <div id="r-report" class="hidden"></div>
        <p id="r-time" class="r-time"></p>
        <p id="r-credit" class="r-credit"></p>
        <p id="r-more" class="r-credit"></p>
        <div class="btn-row">
          <button class="big-btn" id="r-main"></button>
          <button class="soft-btn" id="r-later" data-i18n="later"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Shop -->
  <div id="shop" class="overlay hidden">
    <div class="modal-card wide">
      <div class="panel-top"><h2 data-i18n="shop">Shop</h2><span class="hud-pill" id="shop-coins"></span><button class="close-x" data-close="shop" aria-label="close" data-i18n-label="close">✕</button></div>
      <div class="tab-row">
        <button class="soft-btn small" data-tab="decor" data-i18n="tabDecor"></button>
        <button class="soft-btn small" data-tab="pet" data-i18n="tabPet"></button>
        <button class="soft-btn small" data-tab="costume" data-i18n="tabCostume"></button>
      </div>
      <div class="item-grid" id="shop-list"></div>
    </div>
  </div>

  <!-- Album -->
  <div id="album" class="overlay hidden">
    <div class="modal-card wide">
      <div class="panel-top"><h2 data-i18n="album">Album</h2><button class="close-x" data-close="album" aria-label="close" data-i18n-label="close">✕</button></div>
      <div class="tab-row">
        <button class="soft-btn small" data-tab="badges" data-i18n="badges"></button>
        <button class="soft-btn small" data-tab="stickers" data-i18n="stickers"></button>
      </div>
      <p class="small-note" id="album-hint"></p>
      <div class="item-grid" id="album-list"></div>
    </div>
  </div>

  <!-- My progress -->
  <div id="progress" class="overlay hidden">
    <div class="modal-card wide">
      <div class="panel-top"><h2 data-i18n="progress">My progress</h2><button class="close-x" data-close="progress" aria-label="close" data-i18n-label="close">✕</button></div>
      <div id="progress-body"></div>
      <p class="small-note" data-i18n="progNote"></p>
    </div>
  </div>

  <!-- Daily bonus -->
  <div id="daily" class="overlay hidden">
    <div class="modal-card center">
      <div class="result-emoji">🎁</div>
      <h2 data-i18n="dailyTitle">Daily bonus!</h2>
      <p class="daily-streak" id="daily-streak"></p>
      <div class="daily-days" id="daily-days"></div>
      <p class="small-note" data-i18n="dailyText"></p>
      <button class="big-btn" id="daily-collect"></button>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings" class="overlay hidden">
    <div class="modal-card">
      <h2 data-i18n="settings">Settings</h2>
      <label class="row"><input type="checkbox" id="set-low"> <span data-i18n="lowGraphics"></span></label>
      <label class="row"><input type="checkbox" id="set-sound"> <span data-i18n="sound"></span></label>
      <label class="row"><input type="checkbox" id="set-voice"> <span data-i18n="voiceSetting"></span></label>
      <label class="row"><input type="checkbox" id="set-read"> <span data-i18n="readAloudSetting"></span></label>
      <div class="row"><span data-i18n="lipi"></span>
        <button class="soft-btn small lipi-btn" data-lipi="old" data-i18n="lipiOld"></button>
        <button class="soft-btn small lipi-btn" data-lipi="new" data-i18n="lipiNew"></button>
      </div>
      <div class="row"><span data-i18n="medium"></span>
        <button class="soft-btn small" data-lang="ml">മലയാളം</button>
        <button class="soft-btn small" data-lang="en">English</button>
      </div>
      <div class="btn-row">
        <button class="soft-btn" id="settings-about" data-i18n="about"></button>
        <button class="soft-btn" id="credits-btn" data-i18n="credits"></button>
        <button class="soft-btn danger" id="reset-btn" data-i18n="resetProgress"></button>
      </div>
      <div class="install-box">
        <button class="soft-btn hidden" id="install-btn" data-i18n="installApp"></button>
        <p class="small-note" id="install-note"></p>
      </div>
      <p class="small-note" data-i18n="privacy"></p>
      <button class="big-btn" data-close="settings" data-i18n="close"></button>
    </div>
  </div>

  <!-- Credits -->
  <div id="about" class="overlay hidden">
    <div class="modal-card">
      <h2 data-i18n="about">About</h2>
      <p data-i18n="aboutGame"></p>
      <p class="about-made" data-i18n="aboutMade"></p>
      <p data-i18n="aboutNotOfficial"></p>
      <p data-i18n="privacy"></p>
      <h3 data-i18n="aboutContact">Contact</h3>
      <p data-i18n="aboutContactNote"></p>
      <a class="big-btn about-link" id="about-telegram" href="https://t.me/Hamsajaisal" target="_blank" rel="noopener" data-i18n="aboutTelegram">Telegram</a>
      <div class="btn-row">
        <button class="soft-btn" id="about-credits" data-i18n="credits"></button>
        <button class="soft-btn" data-close="about" data-i18n="close"></button>
      </div>
    </div>
  </div>

  <div id="credits" class="overlay hidden">
    <div class="modal-card">
      <h2 data-i18n="credits">Credits</h2>
      <h3 data-i18n="creditsQuestions"></h3>
      <ul id="credits-list"></ul>
      <p class="small-note" data-i18n="unreviewedNote"></p>
      <p class="small-note" data-i18n="creditsMade"></p>
      <button class="big-btn" data-close="credits" data-i18n="close"></button>
    </div>
  </div>

  <!-- Touch controls -->
  <div id="joy-zone"></div>
  <div id="joystick"><div id="joy-knob"></div></div>
  <div id="cam-btns" class="hidden">
    <button class="hud-btn icon" id="cam-left" aria-label="turn left" data-i18n-label="turnLeft">⟲</button>
    <button class="hud-btn icon" id="cam-right" aria-label="turn right" data-i18n-label="turnRight">⟳</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
